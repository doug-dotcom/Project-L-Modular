<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project L</title>

    <link
        rel="icon"
        type="image/png"
        href="/ui/icon.png"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/ui/icon.png"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: linear-gradient(
                180deg,
                #0f172a,
                #172554
            );

            font-family: Arial, sans-serif;

            color: white;
        }

        body {

            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {

            padding: 22px;

            font-size: 42px;

            font-weight: bold;

            color: #22c55e;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            background: rgba(0,0,0,0.15);

            backdrop-filter: blur(6px);
        }

        /* =====================================================
           CHAT AREA
        ===================================================== */

        #chat {

            flex: 1;

            overflow-y: auto;

            padding: 24px;

            display: flex;

            flex-direction: column;

            gap: 20px;

            scroll-behavior: smooth;
        }

        /* =====================================================
           MESSAGE BUBBLES
        ===================================================== */

        .msg {

            padding: 18px;

            border-radius: 22px;

            max-width: 90%;

            width: fit-content;

            line-height: 1.5;

            font-size: 22px;

            word-wrap: break-word;

            white-space: pre-wrap;

            text-align: left;
        }

        .user {

            background: #2563eb;

            align-self: flex-end;

            text-align: left;
        }

        .assistant {

            background: rgba(255,255,255,0.10);

            border: 1px solid rgba(255,255,255,0.08);

            align-self: flex-start;

            text-align: left;
        }

        .error {

            background: #7f1d1d;
        }

        /* =====================================================
           INPUT BAR
        ===================================================== */

        #inputBar {

            display: flex;

            gap: 12px;

            padding: 14px;

            background: rgba(0,0,0,0.20);

            border-top: 1px solid rgba(255,255,255,0.08);

            backdrop-filter: blur(8px);

            position: sticky;

            bottom: 0;
        }

        /* =====================================================
           TEXT INPUT
        ===================================================== */

        #message {

            flex: 1;

            padding: 14px;

            border-radius: 14px;

            border: none;

            outline: none;

            resize: none;

            min-height: 60px;

            max-height: 180px;

            overflow-y: auto;

            font-size: 16px;

            background: rgba(255,255,255,0.08);

            color: white;

            font-family: Arial, sans-serif;
        }

        #message::placeholder {

            color: rgba(255,255,255,0.5);
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        button {

            min-width: 75px;

            border: none;

            border-radius: 14px;

            background: #22c55e;

            color: black;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            background: #16a34a;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            header {

                font-size: 30px;

                padding: 20px;
            }

            #chat {

                padding: 18px;
            }

            .msg {

                max-width: 90%;

                font-size: 22px;

                line-height: 1.5;

                padding: 18px;

                text-align: left;
            }

            #inputBar {

                padding-bottom: 20px;
            }

            #message {

                min-height: 60px;

                font-size: 16px;
            }

            button {

                min-width: 75px;

                font-size: 15px;
            }
        }

    </style>

</head>

<body>

    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>
        Project L
    </header>

    <!-- =====================================================
         CHAT
    ===================================================== -->

    <div id="chat">

        <div class="msg assistant">
            L online 👊
        </div>

    </div>

    <!-- =====================================================
         INPUT BAR
    ===================================================== -->

    <div id="inputBar">

        <!-- =====================================================
             UPLOAD BUTTON
        ===================================================== -->

        <button
            id="uploadBtn"
            style="
                width:50px;
                height:50px;
                border-radius:14px;
                font-size:22px;
                background:#2b6cff;
                color:white;
                border:none;
                cursor:pointer;
                flex-shrink:0;
            "
        >
            +
        </button>

        <input
            type="file"
            id="fileInput"
            accept="image/jpeg,image/png,image/webp,image/gif"
            style="display:none;"
        />

        <!-- =====================================================
             MESSAGE INPUT
        ===================================================== -->

        <textarea
            id="message"
            placeholder="Talk to L..."
        ></textarea>

        <!-- =====================================================
             SEND BUTTON
        ===================================================== -->

        
<button
    id="voiceToggle"
    style="
        width:50px;
        height:50px;
        border-radius:14px;
        font-size:24px;
        background:#374151;
        color:white;
        border:none;
        cursor:pointer;
        flex-shrink:0;
    "
>
🔊
</button>
<button onclick="sendMessage()">
            Send
        </button>

    </div>

    <!-- =====================================================
         UPLOAD SCRIPT
    ===================================================== -->

    <script>

        const uploadBtn =
            document.getElementById("uploadBtn");

        const fileInput =
            document.getElementById("fileInput");

        uploadBtn.onclick = () => {

            fileInput.click();
        };

        async function submitImage(file) {
            if (!file) return;
            const chat = document.getElementById("chat");
            const input = document.getElementById("message");
            const prompt = input.value.trim() || "Tell me what you can see in this picture.";
            const requestId = newChatRequestId();
            const preview = document.createElement("img");
            preview.src = URL.createObjectURL(file);
            preview.alt = "Picture sent to L";
            preview.style.cssText = "display:block;max-width:72%;max-height:280px;margin:10px 0 10px auto;border-radius:14px;object-fit:contain;";
            chat.appendChild(preview);
            appendChatMessage(chat, "user", prompt);
            input.value = "";
            const thinking = appendChatMessage(chat, "assistant", "L is looking at your picture...");
            chat.scrollTop = chat.scrollHeight;

            const formData = new FormData();
            formData.append("file", file);
            formData.append("request_id", requestId);
            formData.append("prompt", prompt);
            rememberPendingRequest(requestId, prompt, "image");

            try {
                const response = await fetch("/image/start", {method: "POST", body: formData});
                const start = await response.json();
                if (!response.ok || start.status === "unsupported_file" || start.status === "invalid_file_size") {
                    throw new Error(start.message || "Image upload failed");
                }
                const result = await recoverChatResponse(requestId);
                thinking.remove();
                clearPendingRequest(requestId);
                if (!result || !result.reply) throw new Error("Image response was not recovered");
                appendChatMessage(chat, "assistant", result.reply);
            } catch (error) {
                thinking.remove();
                clearPendingRequest(requestId);
                appendChatMessage(chat, "assistant error", error.message || "Picture upload failed. Please try again.");
            } finally {
                fileInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        fileInput.onchange = () => submitImage(fileInput.files[0]);

        document.addEventListener("dragover", event => event.preventDefault());
        document.addEventListener("drop", event => {
            event.preventDefault();
            const file = event.dataTransfer && event.dataTransfer.files[0];
            if (file) submitImage(file);
        });

    </script>

    <!-- =====================================================
         CHAT SCRIPT
    ===================================================== -->

    <script>

        const API_URL = "/chat/start";
        const PENDING_REQUEST_KEY = "project-l-pending-request";
        let lastAssistantText = "";
        const RECOVERY_TOKEN_KEY = "project-l-recovery-token";
        function recoveryHeaders() {
            let token = localStorage.getItem(RECOVERY_TOKEN_KEY);
            if (!token) {
                const bytes = new Uint8Array(32);
                window.crypto.getRandomValues(bytes);
                token = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
                localStorage.setItem(RECOVERY_TOKEN_KEY, token);
            }
            return {"X-L-Recovery-Token": token};
        }
        function savedTasks() {
            try { return JSON.parse(localStorage.getItem("project-l-saved-tasks") || "[]"); }
            catch (_) { return []; }
        }


        const sleep = (milliseconds) =>
            new Promise(resolve => setTimeout(resolve, milliseconds));

        function newChatRequestId() {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return window.crypto.randomUUID();
            }
            return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
                /[xy]/g,
                character => {
                    const random = Math.random() * 16 | 0;
                    const value = character === "x" ? random : (random & 0x3 | 0x8);
                    return value.toString(16);
                }
            );
        }

        function appendChatMessage(chat, className, text, id = "") {
            const element = document.createElement("div");
            element.className = `msg ${className}`;
            if (id) element.id = id;
            element.textContent = text;
            chat.appendChild(element);
            if (className === "assistant" && !String(text).startsWith("L is ")) {
                lastAssistantText = text;
            }
            return element;
        }

        function rememberPendingRequest(requestId, message, kind = "chat") {
            const tasks = savedTasks().filter(task => task.requestId !== requestId);
            tasks.push({requestId, message, kind, pending: true});
            localStorage.setItem("project-l-saved-tasks", JSON.stringify(tasks.slice(-100)));
            localStorage.setItem(PENDING_REQUEST_KEY, JSON.stringify({requestId, message, kind}));
        }

        function clearPendingRequest(requestId) {
            const tasks = savedTasks().map(task => task.requestId === requestId ? {...task, pending: false} : task);
            localStorage.setItem("project-l-saved-tasks", JSON.stringify(tasks));
            let old;
            try { old = JSON.parse(localStorage.getItem(PENDING_REQUEST_KEY) || "null"); } catch (_) {}
            if (!requestId || old?.requestId === requestId) localStorage.removeItem(PENDING_REQUEST_KEY);
        }

        async function recoverChatResponse(requestId) {
            for (let attempt = 0; attempt < 120; attempt += 1) {
                await sleep(2000);
                try {
                    const response = await fetch(
                        `/chat/result/${encodeURIComponent(requestId)}`,
                        { cache: "no-store", headers: recoveryHeaders() }
                    );
                    if (!response.ok) continue;
                    const data = await response.json();
                    if (["failed", "interrupted"].includes(data.status)) {
                        return data.result || {reply: "This task was interrupted. Its request is saved, but I have not repeated it because an action may already have happened. Please review before sending it again.", error: true};
                    }
                    if (data.status === "ready" && data.result) {
                        return data.result;
                    }
                } catch (error) {
                    // The next bounded poll may recover from a transient drop.
                }
            }
            return null;
        }

        async function sendMessage() {

            const input =
                document.getElementById("message");

            const chat =
                document.getElementById("chat");

            const message =
                input.value.trim();

            if (!message) return;

            // =====================================================
            // USER MESSAGE
            // =====================================================

            appendChatMessage(chat, "user", message);

            input.value = "";

            // =====================================================
            // THINKING MESSAGE
            // =====================================================

            const thinkingId =
                "thinking-" + Date.now();

            const thinking = appendChatMessage(
                chat,
                "assistant",
                "L is thinking...",
                thinkingId
            );

            const requestId = newChatRequestId();
            rememberPendingRequest(requestId, message, "chat");

            chat.scrollTop =
                chat.scrollHeight;

            try {

                const response = await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            ...recoveryHeaders()
                        },

                        body: JSON.stringify({
                            message: message,
                            request_id: requestId
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(`Chat request returned ${response.status}`);
                }

                const start = await response.json();

                if (start.status === "invalid_request_id") {
                    throw new Error("The request could not be started");
                }

                const data = await recoverChatResponse(requestId);

                if (!data || !data.reply) {
                    throw new Error("L's answer was not recovered");
                }

                // =====================================================
                // REMOVE THINKING
                // =====================================================

                thinking.remove();
                clearPendingRequest(requestId);

                // =====================================================
                // ASSISTANT RESPONSE
                // =====================================================

                appendChatMessage(chat, "assistant", data.reply);

            } catch (err) {
                thinking.textContent = "L is still thinking...";
                const recovered = await recoverChatResponse(requestId);
                thinking.remove();
                if (recovered && recovered.reply) {
                    clearPendingRequest(requestId);
                    appendChatMessage(chat, "assistant", recovered.reply);
                } else {
                    appendChatMessage(
                        chat,
                        "assistant error",
                        "I could not recover the answer yet. Check Saved answers shortly before resending the task."
                    );
                }
            }

            chat.scrollTop =
                chat.scrollHeight;
        }

        async function resumePendingRequest() {
            let tasks = savedTasks();
            if (!tasks.length) {
                try {
                    const old = JSON.parse(localStorage.getItem(PENDING_REQUEST_KEY) || "null");
                    if (old?.requestId) tasks = [{...old, pending: true}];
                } catch (_) {}
            }
            const chat = document.getElementById("chat");
            const button = document.createElement("button");
            button.textContent = "Saved answers";
            button.type = "button";
            chat.parentElement.insertBefore(button, chat);
            button.onclick = async () => {
                button.disabled = true;
                try {
                    const recent = savedTasks().slice(-20);
                    if (!recent.length) appendChatMessage(chat, "assistant", "Your saved answers will appear here after you send a message.");
                    for (const task of recent) {
                        const response = await fetch(`/chat/result/${encodeURIComponent(task.requestId)}`, {cache: "no-store", headers: recoveryHeaders()});
                        if (!response.ok) throw new Error("unavailable");
                        const result = await response.json();
                        appendChatMessage(chat, "user", task.message);
                        appendChatMessage(chat, "assistant", result.result?.reply ||
                            (result.status === "interrupted" ? "This task was interrupted. Please review before starting it again." :
                             result.status === "not_found" ? "This answer is unavailable in this browser." : "L is working on this saved task."));
                    }
                } catch (_) {
                    appendChatMessage(chat, "assistant error", "Saved answers are temporarily unavailable. Please try again shortly.");
                } finally { button.disabled = false; }
            };
            for (const pending of tasks.filter(task => task.pending)) {
                const thinking = appendChatMessage(chat, "assistant", "Reconnecting to L's saved task...");
                const result = await recoverChatResponse(pending.requestId);
                thinking.remove();
                if (result?.reply) {
                    clearPendingRequest(pending.requestId);
                    appendChatMessage(chat, "assistant", result.reply);
                } else {
                    appendChatMessage(chat, "assistant", "I could not reconnect yet. You can check Saved answers again shortly.");
                }
                chat.scrollTop = chat.scrollHeight;
            }
        }

        document.addEventListener("DOMContentLoaded", resumePendingRequest);

    </script>


<script>

document
.addEventListener(
"DOMContentLoaded",
() => {

    const btn =
        document.getElementById(
            "voiceToggle"
        );

    if(!btn){
        return;
    }

    if (!("speechSynthesis" in window)) {
        btn.disabled = true;
        btn.title = "Text-to-speech is unavailable in this browser";
        return;
    }

    btn.title = "Read L's latest reply aloud";
    btn.onclick = () => {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            btn.innerText = "🔊";
            return;
        }
        if (!lastAssistantText) return;
        const utterance = new SpeechSynthesisUtterance(lastAssistantText);
        utterance.lang = "en-AU";
        const voices = window.speechSynthesis.getVoices();
        utterance.voice = voices.find(voice => voice.lang === "en-AU") ||
            voices.find(voice => voice.lang.startsWith("en")) || null;
        utterance.onend = utterance.onerror = () => { btn.innerText = "🔊"; };
        btn.innerText = "⏹️";
        window.speechSynthesis.speak(utterance);
    };

});

</script>

</body>

</html>
