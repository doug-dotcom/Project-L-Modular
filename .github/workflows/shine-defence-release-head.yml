name: Shine Defence Release Head

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: shine-defence-release-head
  cancel-in-progress: true

jobs:
  attest:
    uses: doug-dotcom/ShineUniverse-shine-core/.github/workflows/shine-defence-release-attestation-v1.yml@7bfd7fe685b4b2da814ac53dafdbfac2350591c8
    with:
      target_id: railway:project-l
      source_branch: main
