name: Shine Defence Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/shine-defence-release-head.yml'
      - '.github/workflows/shine-defence-compatibility.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/shine-defence-release-head.yml'
      - '.github/workflows/shine-defence-compatibility.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify immutable Core Defence authority caller
        run: |
          FILE=.github/workflows/shine-defence-release-head.yml
          grep -Fq "uses: doug-dotcom/ShineUniverse-shine-core/.github/workflows/shine-defence-release-attestation-v1.yml@7bfd7fe685b4b2da814ac53dafdbfac2350591c8" "$FILE"
          grep -Fq "target_id: railway:project-l" "$FILE"
          grep -Fq "source_branch: main" "$FILE"
          grep -Fq "contents: read" "$FILE"
          grep -Fq "id-token: write" "$FILE"
          ! grep -Eq '^[[:space:]]+(runs-on|steps|secrets):' "$FILE"
          echo "Shine Defence reusable authority caller: PASS"
